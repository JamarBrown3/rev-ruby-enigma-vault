<text x="80" y="75" class="title">REV / The Ruby Enigma Vault</text>
<text x="80" y="122" class="subtitle">MongoDB relationship diagram | Revision 2 | 22 October 2026</text>
<text x="80" y="165" class="note">Account-only reactions, comments, password recovery, and session storage. References are NOT automatic SQL foreign keys.</text>
