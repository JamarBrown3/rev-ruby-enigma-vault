<text x="2555" y="840" class="label">category membership</text>
<rect x="80" y="230" width="800" height="510" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M92,230H868Q880,230 880,242V294H80V242Q80,230 92,230" fill="#692341"/>
<text x="105" y="273" class="head">users</text>
<text x="105" y="334" class="row">_id : ObjectId</text>
<text x="105" y="372" class="row">username, email : String [unique, normalized]</text>
<text x="105" y="410" class="row">passwordHash : String [server only]</text>
<text x="105" y="448" class="row">role : user | admin; status : active | banned</text>
<text x="105" y="486" class="row">sessionVersion : Number [default 0]</text>
<text x="105" y="524" class="row">profile : { bio?, avatarUrl? } [embedded]</text>
<text x="105" y="562" class="row">createdAt, updatedAt : Date</text>
<text x="105" y="683" class="note">Registration always assigns role=user.</text>
<text x="105" y="715" class="note">Increment sessionVersion on password reset.</text>
<rect x="1100" y="230" width="800" height="510" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M1112,230H1888Q1900,230 1900,242V294H1100V242Q1100,230 1112,230" fill="#692341"/>
<text x="1125" y="273" class="head">posts (reviews + discussions)</text>
<text x="1125" y="334" class="row">_id : ObjectId; authorId : ObjectId -&gt; users</text>
<text x="1125" y="372" class="row">gameId : ObjectId -&gt; games [optional]</text>
<text x="1125" y="410" class="row">kind : review | discussion</text>
<text x="1125" y="448" class="row">title, body : String; imageUrl? : String</text>
<text x="1125" y="486" class="row">rating : Number 1..10 [reviews only]</text>
<text x="1125" y="524" class="row">recommended : Boolean [reviews only]</text>
<text x="1125" y="562" class="row">createdAt, updatedAt : Date</text>
<text x="1125" y="683" class="note">A review requires gameId + rating.</text>
<text x="1125" y="715" class="note">Only author edits/deletes; delete comments + votes.</text>
<rect x="2120" y="230" width="800" height="510" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M2132,230H2908Q2920,230 2920,242V294H2120V242Q2120,230 2132,230" fill="#692341"/>
<text x="2145" y="273" class="head">games</text>
<text x="2145" y="334" class="row">_id : ObjectId; title, description : String</text>
<text x="2145" y="372" class="row">platform, genre : String; releaseYear : Number</text>
<text x="2145" y="410" class="row">coverImage, headerImage : String</text>
<text x="2145" y="448" class="row">categoryIds : ObjectId[] -&gt; categories</text>
<text x="2145" y="486" class="row">playtimeHours : Number &gt;= 0</text>
<text x="2145" y="524" class="row">createdAt, updatedAt : Date</text>
<text x="2145" y="683" class="note">Average rating is derived from review posts.</text>
<text x="2145" y="715" class="note">Catalog retained from REV revision 1.</text>
<rect x="80" y="960" width="800" height="380" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M92,960H868Q880,960 880,972V1024H80V972Q80,960 92,960" fill="#692341"/>
<text x="105" y="1003" class="head">comments</text>
<text x="105" y="1064" class="row">_id : ObjectId; postId : ObjectId -&gt; posts</text>
<text x="105" y="1102" class="row">authorId : ObjectId -&gt; users [required]</text>
<text x="105" y="1140" class="row">body : String</text>
<text x="105" y="1178" class="row">createdAt, updatedAt : Date</text>
<text x="105" y="1283" class="note">Flat comments; threaded replies are not in scope.</text>
<text x="105" y="1315" class="note">Author-only edits/deletes proposed; public reads.</text>
<rect x="1100" y="960" width="800" height="380" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M1112,960H1888Q1900,960 1900,972V1024H1100V972Q1100,960 1112,960" fill="#692341"/>
<text x="1125" y="1003" class="head">votes</text>
<text x="1125" y="1064" class="row">_id : ObjectId; postId : ObjectId -&gt; posts</text>
<text x="1125" y="1102" class="row">userId : ObjectId -&gt; users [required]</text>
<text x="1125" y="1140" class="row">value : Number [1 = like; -1 = dislike]</text>
<text x="1125" y="1178" class="row">createdAt, updatedAt : Date</text>
<text x="1125" y="1283" class="note">UNIQUE compound index: { postId, userId }.</text>
<text x="1125" y="1315" class="note">No guests. Switching sides updates the same vote.</text>
<rect x="2120" y="960" width="800" height="300" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M2132,960H2908Q2920,960 2920,972V1024H2120V972Q2120,960 2132,960" fill="#692341"/>
<text x="2145" y="1003" class="head">categories</text>
<text x="2145" y="1064" class="row">_id : ObjectId</text>
<text x="2145" y="1102" class="row">name, slug : String [unique]</text>
<text x="2145" y="1203" class="note">Games keep category IDs; no SQL join collection.</text>
<text x="2145" y="1235" class="note">Both sides can have zero or many memberships.</text>
<text x="80" y="1450" class="label">SUPPORTING COLLECTIONS + PORTFOLIO</text>
<text x="80" y="1490" class="note">Account references below are listed in fields to keep the main diagram readable. Session layout is adapter-managed.</text>
<rect x="80" y="1540" width="800" height="420" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M92,1540H868Q880,1540 880,1552V1604H80V1552Q80,1540 92,1540" fill="#354b68"/>
<text x="105" y="1583" class="head">sessions [connect-mongo infrastructure]</text>
<text x="105" y="1644" class="row">_id : String [adapter-managed session ID]</text>
<text x="105" y="1682" class="row">session : serialized session payload</text>
<text x="105" y="1720" class="row">  userId -&gt; users._id [authenticated only]</text>
<text x="105" y="1758" class="row">  sessionVersion : Number [authenticated only]</text>
<text x="105" y="1796" class="row">expires : Date [adapter-managed TTL]</text>
<text x="105" y="1871" class="note">Browser cookie contains a session ID, not a password.</text>
<text x="105" y="1903" class="note">Stored payload is logical; adapter controls encoding.</text>
<text x="105" y="1935" class="note">Check version/status on protected requests.</text>
<rect x="1100" y="1540" width="800" height="420" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M1112,1540H1888Q1900,1540 1900,1552V1604H1100V1552Q1100,1540 1112,1540" fill="#354b68"/>
<text x="1125" y="1583" class="head">passwordResetTokens [authentication]</text>
<text x="1125" y="1644" class="row">_id : ObjectId; userId : ObjectId -&gt; users</text>
<text x="1125" y="1682" class="row">tokenHash : String [unique; never raw token]</text>
<text x="1125" y="1720" class="row">expiresAt : Date [TTL index]</text>
<text x="1125" y="1758" class="row">usedAt : Date | null</text>
<text x="1125" y="1796" class="row">createdAt : Date</text>
<text x="1125" y="1871" class="note">One user can have 0..many token records.</text>
<text x="1125" y="1903" class="note">Short-lived, single-use; consume atomically.</text>
<text x="1125" y="1935" class="note">Check expiry in code; TTL cleanup is not immediate.</text>
<rect x="2120" y="1540" width="800" height="420" rx="12" fill="white" stroke="#c9d2df" stroke-width="2"/><path d="M2132,1540H2908Q2920,1540 2920,1552V1604H2120V1552Q2120,1540 2132,1540" fill="#692341"/>
<text x="2145" y="1583" class="head">projects [portfolio content]</text>
<text x="2145" y="1644" class="row">_id : ObjectId; title, description : String</text>
<text x="2145" y="1682" class="row">techStack : String[]</text>
<text x="2145" y="1720" class="row">imageUrl, liveUrl, githubUrl : String</text>
<text x="2145" y="1758" class="row">createdAt, updatedAt : Date</text>
<text x="2145" y="1871" class="note">Standalone content; admin-managed writes.</text>
<text x="2145" y="1903" class="note">No dashboard collection: aggregate source data.</text>
<text x="2145" y="1935" class="note">Public Services page stays public.</text>
<rect x="80" y="2030" width="2840" height="290" rx="14" fill="#e8edf5"/>
<text x="110" y="2078" class="label">LEGEND + SCOPE</text>
<text x="110" y="2122" class="note">|| = exactly one; o| = zero or one; o&lt; = zero or many. Each comment/vote belongs to exactly one post and one account.</text>
<text x="110" y="2163" class="note">Post/game link: a post references 0..1 game; a game has 0..many posts. Review posts require a game.</text>
<text x="110" y="2204" class="note">Deletion is Express/Mongoose application logic, not automatic MongoDB cascading. See the companion plan for race-safe deletion.</text>
<text x="110" y="2245" class="note">Dashboard endpoints: admin only. Password-reset email is in scope; marketing subscriptions are deferred to January 2027.</text>
<text x="110" y="2286" class="note">Theme preferences stay in browser localStorage for now. Planning artifact only: no schemas, routes, or database changes made.</text>
</svg>